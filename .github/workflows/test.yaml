on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

name: test

env:
  NODE_VERSION: 24
  XIAOZHEN_PLY_URL: ${{ secrets.XIAOZHEN_PLY }}

jobs:
  test-splat-transform-native:
    if: github.ref == 'refs/heads/main'
    name: test splat-transform native (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64-msvc
            os: windows-2025-vs2026
            shell: pwsh
          - target: win32-arm64-msvc
            os: windows-11-vs2026-arm
            shell: pwsh
          - target: linux-x64-gnu
            os: ubuntu-22.04
            shell: bash
          - target: linux-arm64-gnu
            os: ubuntu-22.04-arm
            shell: bash
          - target: darwin-arm64
            os: macos-26
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Download test data (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output ./data/xiaozhen.ply \
            "$XIAOZHEN_PLY_URL"
          test -s ./data/xiaozhen.ply

      - name: Download test data (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $env:XIAOZHEN_PLY_URL -OutFile './data/xiaozhen.ply'
          if ((Get-Item './data/xiaozhen.ply').Length -le 0) {
            throw 'Downloaded xiaozhen.ply is empty.'
          }

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workspace dependencies
        run: |
          corepack enable
          corepack install
          pnpm install

      - name: Test
        run: |
          mkdir out
          pnpm splat-transform list:gpu
          pnpm splat-transform lod:auto --ratio 0.3 ./data/bear.sog ./out/bear.spz
          pnpm splat-transform lod:auto-chunk --type spz ./data/bear.sog ./out/bear
          pnpm splat-transform lod:auto --ratio 0.3 ./data/xiaozhen.ply ./out/xiaozhen.spz
          pnpm splat-transform lod:auto-chunk --type spz ./data/xiaozhen.ply ./out/xiaozhen
