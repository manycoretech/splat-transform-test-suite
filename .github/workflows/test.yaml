on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

name: test

env:
  NODE_VERSION: 24
  LINUX_TEST_IMAGE: ghcr.io/manycoretech/aholo-viewer/aholo-native-linux:latest
  XIAOZHEN_PLY_URL: ${{ secrets.XIAOZHEN_PLY }}
  DATA_ARTIFACT_PASSWORD: ${{ secrets.DATA_ARTIFACT_PASSWORD }}

jobs:
  download-data:
    if: github.ref == 'refs/heads/main'
    environment:
      name: test
      deployment: false
    name: download data
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download data
        shell: bash
        run: |
          mkdir -p ./data
          curl --fail --location --silent --show-error --retry 3 --output ./data/xiaozhen.ply "$XIAOZHEN_PLY_URL"
          curl --fail --location --silent --show-error --retry 3 --output ./data/bear.sog https://holo-cos.aholo3d.cn/aholo-opensource/gs_file/bear/bear.3d71a266.sog
          test -s ./data/xiaozhen.ply
          test -s ./data/bear.sog

      - name: Encrypt data artifact
        shell: bash
        run: |
          tar -czf ./data.tar.gz -C ./data .
          node ci/data-artifact-crypto.cjs encrypt ./data.tar.gz ./data.tar.gz.enc

      - name: Upload data artifact
        uses: actions/upload-artifact@v7
        with:
          name: data
          path: ./data.tar.gz.enc
          if-no-files-found: error
          retention-days: 1

  test-splat-transform-native:
    if: github.ref == 'refs/heads/main'
    environment:
      name: test
      deployment: false
    name: test splat-transform native (${{ matrix.target }})
    needs: download-data
    permissions:
      contents: read
      packages: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64-msvc
            os: windows-2025-vs2026
            shell: pwsh
          - target: win32-arm64-msvc
            os: windows-11-vs2026-arm
            shell: pwsh
          - target: linux-x64-gnu
            os: ubuntu-26.04
            shell: bash
          - target: linux-arm64-gnu
            os: ubuntu-26.04-arm
            shell: bash
          - target: darwin-arm64
            os: macos-26
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        if: runner.os == 'Linux'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download encrypted data artifact
        uses: actions/download-artifact@v7
        with:
          name: data
          path: ./artifact

      - name: Decrypt data artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p ./data
          node ci/data-artifact-crypto.cjs decrypt ./artifact/data.tar.gz.enc ./data.tar.gz
          tar -xzf ./data.tar.gz -C ./data

      - name: Decrypt data artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./data | Out-Null
          node ci/data-artifact-crypto.cjs decrypt ./artifact/data.tar.gz.enc ./data.tar.gz
          tar -xzf ./data.tar.gz -C ./data

      - name: Verify data artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -s ./data/xiaozhen.ply
          test -s ./data/bear.sog

      - name: Verify data artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((Get-Item './data/xiaozhen.ply').Length -le 0) {
            throw 'xiaozhen.ply artifact is empty.'
          }
          if ((Get-Item './data/bear.sog').Length -le 0) {
            throw 'bear.sog artifact is empty.'
          }

      - name: Test
        if: runner.os != 'Linux'
        run: |
          corepack enable
          corepack install
          pnpm install
          mkdir out
          mkdir out/logs
          pnpm splat-transform list:gpu
          pnpm splat-transform lod:auto --ratio 0.3 ./data/bear.sog ./out/bear.spz > ./out/logs/bear-auto.log 2>&1
          cat ./out/logs/bear-auto.log
          pnpm splat-transform lod:auto-chunk --type spz ./data/bear.sog ./out/bear > ./out/logs/bear-auto-chunk.log 2>&1
          cat ./out/logs/bear-auto-chunk.log
          pnpm splat-transform lod:auto --ratio 0.3 ./data/xiaozhen.ply ./out/xiaozhen.spz > ./out/logs/xiaozhen-auto.log 2>&1
          cat ./out/logs/xiaozhen-auto.log
          pnpm splat-transform lod:auto-chunk --type spz ./data/xiaozhen.ply ./out/xiaozhen > ./out/logs/xiaozhen-auto-chunk.log 2>&1
          cat ./out/logs/xiaozhen-auto-chunk.log
          pnpm verify

      - name: Test (Linux container)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/work" \
            --workdir /work \
            --env CI \
            "$LINUX_TEST_IMAGE" \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends libvulkan1 vulkan-tools mesa-vulkan-drivers
              rm -rf /var/lib/apt/lists/*
              corepack enable
              corepack install
              pnpm install
              mkdir -p ./out/logs
              pnpm splat-transform list:gpu
              pnpm splat-transform lod:auto --ratio 0.3 ./data/bear.sog ./out/bear.spz > ./out/logs/bear-auto.log 2>&1
              cat ./out/logs/bear-auto.log
              pnpm splat-transform lod:auto-chunk --type spz ./data/bear.sog ./out/bear > ./out/logs/bear-auto-chunk.log 2>&1
              cat ./out/logs/bear-auto-chunk.log
              pnpm splat-transform lod:auto --ratio 0.3 ./data/xiaozhen.ply ./out/xiaozhen.spz > ./out/logs/xiaozhen-auto.log 2>&1
              cat ./out/logs/xiaozhen-auto.log
              pnpm splat-transform lod:auto-chunk --type spz ./data/xiaozhen.ply ./out/xiaozhen > ./out/logs/xiaozhen-auto-chunk.log 2>&1
              cat ./out/logs/xiaozhen-auto-chunk.log
              pnpm verify
            '
